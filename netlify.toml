[build]
  publish = "."

# Serve /tools cleanly (directory index)
[[redirects]]
  from = "/tools"
  to   = "/tools/index.html"
  status = 200

# JSX files must be served as JavaScript so @babel/standalone can load them
[[headers]]
  for = "/*.jsx"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
