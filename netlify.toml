[build]
  publish = "."

# /tools serves the tools page with a clean URL (no .html visible)
[[redirects]]
  from = "/tools"
  to   = "/tools.html"
  status = 200

# JSX files must be served as JavaScript for @babel/standalone
[[headers]]
  for = "/*.jsx"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
