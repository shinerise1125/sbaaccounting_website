<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Business Accounting — IPA-certified accountants for Australian businesses</title>
  <meta name="description" content="Plain-English tax, BAS, and bookkeeping for 400+ Australian businesses. IPA-certified, fixed-fee, English + 中文.">
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="stylesheet" href="/colors_and_type.css">
  <style>
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    *:focus-visible { outline: 2px solid color-mix(in oklab, var(--sba-copper) 60%, transparent); outline-offset: 2px; border-radius: 4px; }
    a { color: inherit; }
    button { font-family: inherit; }
    input:focus, select:focus, textarea:focus { border-color: var(--sba-copper) !important; box-shadow: 0 0 0 3px color-mix(in oklab, var(--sba-copper) 18%, transparent) !important; }
    html { scroll-behavior: smooth; }
  </style>
  <script>
    window.__resources = { logoMark: "/assets/logo-mark.png" };
  </script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="/components/components.jsx"></script>
  <script type="text/babel" src="/components/TopBar.jsx"></script>
  <script type="text/babel" src="/components/Nav.jsx"></script>
  <script type="text/babel" src="/components/Hero.jsx"></script>
  <script type="text/babel" src="/components/Services.jsx"></script>
  <script type="text/babel" src="/components/Advantages.jsx"></script>
  <script type="text/babel" src="/components/ConsultationBanner.jsx"></script>
  <script type="text/babel" src="/components/Process.jsx"></script>
  <script type="text/babel" src="/components/News.jsx"></script>
  <script type="text/babel" src="/components/Callback.jsx"></script>
  <script type="text/babel" src="/components/Footer.jsx"></script>
  <script type="text/babel" src="/components/BookModal.jsx"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const App = () => {
      const [lang, setLang] = React.useState("en");
      const [bookOpen, setBookOpen] = React.useState(false);
      const openBook = () => setBookOpen(true);
      const closeBook = () => setBookOpen(false);
      const scrollToServices = () => {
        const el = document.getElementById("services");
        if (el) window.scrollTo({ top: el.offsetTop - 60, behavior: "smooth" });
      };
      return (
        <>
          <TopBar lang={lang} setLang={setLang} />
          <Nav lang={lang} onBook={openBook} />
          <Hero onBook={openBook} onCalc={scrollToServices} lang={lang} />
          <Services />
          <Advantages onBook={openBook} />
          <ConsultationBanner onBook={openBook} />
          <Process />
          <News />
          <Callback />
          <Footer />
          <BookModal open={bookOpen} onClose={closeBook} />
        </>
      );
    };
    const tryMount = () => {
      const needed = ["TopBar","Nav","Hero","Services","Advantages","ConsultationBanner","Process","News","Callback","Footer","BookModal","Logo","Button","Container","Eyebrow","Icon","Pill","Field"];
      if (needed.every((n) => window[n])) {
        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      } else {
        setTimeout(tryMount, 30);
      }
    };
    tryMount();
  </script>
</body>
</html>
